<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}TapeBox{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <div class="brand">
            <div class="brand-icon">
                TB
            </div>

            <div>
                <div class="brand-name">
                    TapeBox
                </div>

                <div class="brand-subtitle">
                    LTFS Archive
                </div>
            </div>
        </div>

        <nav>

            <a
                href="/"
                class="{% if active_page == 'dashboard' %}active{% endif %}"
            >
                Dashboard
            </a>

            <a
                href="{{ url_for('tapes_page') }}"
                class="{% if active_page == 'tapes' %}active{% endif %}"
            >
                Tapes
            </a>

            <a
                href="{{ url_for('files_page') }}"
                class="{% if active_page == 'files' %}active{% endif %}"
            >
                Files
            </a>

            <a
                href="{{ url_for('jobs_page') }}"
                class="{% if active_page == 'jobs' %}active{% endif %}"
            >
                Archive Jobs
            </a>

            <a
                href="{{ url_for('restore_page') }}"
                class="{% if active_page == 'restore' %}active{% endif %}"
            >
                Restore
            </a>

            <a
                href="{{ url_for('tape_inspector_page') }}"
                class="{% if active_page == 'inspector' %}active{% endif %}"
            >
                Tape Inspector
            </a>

            <a
                href="{{ url_for('restored_files_page') }}"
                class="{% if active_page == 'restored' %}active{% endif %}"
            >
                Restored Files
            </a>

            <a
                href="{{ url_for('staging_page') }}"
                class="{% if active_page == 'staging' %}active{% endif %}"
            >
                Staging
            </a>


            <a
                href="{{ url_for('settings_page') }}"
                class="{% if active_page == 'settings' %}active{% endif %}"
            >
                Settings
            </a>


        </nav>

        <div class="sidebar-footer">
            TapeBox
        </div>

    </aside>


    <main class="content">

        {% block content %}
        {% endblock %}

    </main>

</div>

{% block scripts %}
{% endblock %}

</body>
</html>
